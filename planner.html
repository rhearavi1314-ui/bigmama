<title>Bloom Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Nunito:wght@400;600;700&family=Caveat:wght@500;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<style>
/* Layout: sidebar + paper-textured main column of cards; bottom tab bar on phones.
   Colours are hue-driven so accent + paper are user-selectable. */
:root{
  --ah:350; --ac:0.14;           /* accent hue / chroma (set from settings) */
  --ph:75;  --pc:0.018;          /* paper hue / chroma (set from settings) */
  --bg: oklch(0.968 var(--pc) var(--ph));
  --surface: oklch(0.992 calc(var(--pc) * 0.5) var(--ph));
  --sunk: oklch(0.945 calc(var(--pc) * 1.1) var(--ph));
  --line: oklch(0.885 calc(var(--pc) * 1.3) var(--ph));
  --ink: oklch(0.26 0.02 var(--ph));
  --muted: oklch(0.5 0.02 var(--ph));
  --faint: oklch(0.7 0.015 var(--ph));
  --accent: oklch(0.63 var(--ac) var(--ah));
  --accent-ink: oklch(0.48 var(--ac) var(--ah));
  --accent-soft: oklch(0.935 calc(var(--ac) * 0.32) var(--ah));
  --on-accent: oklch(0.99 0.005 var(--ah));
  --good: oklch(0.56 0.11 150);
  --bad: oklch(0.56 0.17 25);
  --bad-soft: oklch(0.94 0.035 25);
  --warn: oklch(0.66 0.13 70);
  --s1: oklch(0.58 0.13 280); --s2: oklch(0.62 0.15 25); --s3: oklch(0.58 0.1 185);
  --chipL: 0.935; --chipC: 0.045; --chipTL: 0.42; --dotL: 0.66;
  --scrim: oklch(0.25 0.02 var(--ph) / 0.35);
  --shadow: 0 1px 2px oklch(0.3 0.02 var(--ph) / 0.05), 0 6px 22px oklch(0.3 0.02 var(--ph) / 0.06);
  --f-display: 'Instrument Serif', Georgia, serif;
  --f-body: 'Figtree', system-ui, -apple-system, sans-serif;
  --f-mono: 'DM Mono', ui-monospace, 'SF Mono', monospace;
  --r: 16px; --r-sm: 10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg: oklch(0.2 calc(var(--pc) * 0.8) var(--ph));
  --surface: oklch(0.24 calc(var(--pc) * 0.8) var(--ph));
  --sunk: oklch(0.185 calc(var(--pc) * 0.8) var(--ph));
  --line: oklch(0.33 calc(var(--pc) * 0.9) var(--ph));
  --ink: oklch(0.93 0.01 var(--ph));
  --muted: oklch(0.72 0.015 var(--ph));
  --faint: oklch(0.52 0.015 var(--ph));
  --accent: oklch(0.74 var(--ac) var(--ah));
  --accent-ink: oklch(0.82 calc(var(--ac) * 0.9) var(--ah));
  --accent-soft: oklch(0.33 calc(var(--ac) * 0.45) var(--ah));
  --on-accent: oklch(0.2 0.03 var(--ah));
  --good: oklch(0.74 0.12 150); --bad: oklch(0.72 0.15 25); --bad-soft: oklch(0.32 0.06 25); --warn: oklch(0.78 0.12 75);
  --s1: oklch(0.74 0.12 280); --s2: oklch(0.76 0.13 25); --s3: oklch(0.76 0.1 185);
  --chipL: 0.33; --chipC: 0.05; --chipTL: 0.86; --dotL: 0.72;
  --scrim: oklch(0.05 0 0 / 0.55);
  --shadow: 0 1px 2px oklch(0 0 0 / 0.3), 0 8px 26px oklch(0 0 0 / 0.25);
  color-scheme: dark;
}}
:root[data-theme="dark"]{
  --bg: oklch(0.2 calc(var(--pc) * 0.8) var(--ph));
  --surface: oklch(0.24 calc(var(--pc) * 0.8) var(--ph));
  --sunk: oklch(0.185 calc(var(--pc) * 0.8) var(--ph));
  --line: oklch(0.33 calc(var(--pc) * 0.9) var(--ph));
  --ink: oklch(0.93 0.01 var(--ph));
  --muted: oklch(0.72 0.015 var(--ph));
  --faint: oklch(0.52 0.015 var(--ph));
  --accent: oklch(0.74 var(--ac) var(--ah));
  --accent-ink: oklch(0.82 calc(var(--ac) * 0.9) var(--ah));
  --accent-soft: oklch(0.33 calc(var(--ac) * 0.45) var(--ah));
  --on-accent: oklch(0.2 0.03 var(--ah));
  --good: oklch(0.74 0.12 150); --bad: oklch(0.72 0.15 25); --bad-soft: oklch(0.32 0.06 25); --warn: oklch(0.78 0.12 75);
  --s1: oklch(0.74 0.12 280); --s2: oklch(0.76 0.13 25); --s3: oklch(0.76 0.1 185);
  --chipL: 0.33; --chipC: 0.05; --chipTL: 0.86; --dotL: 0.72;
  --scrim: oklch(0.05 0 0 / 0.55);
  --shadow: 0 1px 2px oklch(0 0 0 / 0.3), 0 8px 26px oklch(0 0 0 / 0.25);
  color-scheme: dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
p{margin:0}
ul{list-style:none;margin:0;padding:0}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);background:var(--surface);padding:22px 14px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:baseline;gap:8px;padding:0 10px}
.brand b{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1;letter-spacing:-.01em}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block}
.navg{display:flex;flex-direction:column;gap:2px}
.navg .lab{padding:0 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--muted);text-align:left;font-weight:500}
.nav:hover{background:var(--sunk);color:var(--ink)}
.nav.on{background:var(--accent-soft);color:var(--accent-ink)}
.nav svg{width:18px;height:18px;flex:none}
.nav .cnt{margin-left:auto}
.sync{margin-top:auto;padding:0 10px;display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync.synced i{background:var(--good)} .sync.saving i{background:var(--warn)} .sync.offline i{background:var(--bad)}

main{min-width:0;padding-block:26px 60px;padding-inline:clamp(16px,4vw,44px)}
body.pat-dot main{background-image:radial-gradient(circle,var(--line) 1.1px,transparent 1.4px);background-size:22px 22px}
body.pat-grid main{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:26px 26px}
body.pat-lined main{background-image:linear-gradient(transparent 27px,var(--line) 28px);background-size:100% 28px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.top .eyebrow{margin-bottom:6px}
.title{font-family:var(--f-display);font-size:clamp(34px,5vw,50px);line-height:1.02;letter-spacing:-.01em}
.title em{color:var(--accent-ink)}
.sub{color:var(--muted);margin-top:8px;display:flex;gap:6px 14px;flex-wrap:wrap;font-size:14px}
.sub b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lab{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:400}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
.btn.sm{padding:5px 11px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn svg{width:16px;height:16px}
.icon-btn{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--surface)}
.icon-btn svg{width:16px;height:16px}
.link{color:var(--accent-ink);font-weight:500;font-size:13px}
.link:hover{text-decoration:underline}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--muted)}

.in{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0;width:100%}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
textarea.in{resize:vertical;min-height:70px;line-height:1.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row > .in{flex:1 1 140px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > .lab{font-size:10px}

/* cards */
.cols{columns:3 320px;column-gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 18px;break-inside:avoid;margin-bottom:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{margin-bottom:0}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chead h3{font-family:var(--f-display);font-size:24px;line-height:1.1}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.sec-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px;align-items:start}

/* tasks */
.tasks{display:flex;flex-direction:column}
.task{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.chk{width:20px;height:20px;margin-top:1px;border:1.5px solid var(--faint);border-radius:7px;flex:none;position:relative;transition:background .15s,border-color .15s}
.chk:hover{border-color:var(--accent)}
.done > .chk,.chk.on{background:var(--accent);border-color:var(--accent)}
.done > .chk::after,.chk.on::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:rotate(45deg)}
.tmain{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:3px}
.ttitle{overflow-wrap:anywhere}
.done .ttitle{text-decoration:line-through;color:var(--faint)}
.tmeta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12px;color:var(--muted)}
.tmeta:empty{display:none}
.star{color:var(--faint);font-size:16px;line-height:1;padding:2px 2px 0;flex:none}
.star.on{color:var(--accent)}
.pri3 .chk{border-color:var(--bad)} .pri2 .chk{border-color:var(--warn)}
.cat{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:500;background:oklch(var(--chipL) var(--chipC) var(--h));color:oklch(var(--chipTL) 0.11 var(--h));white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:oklch(var(--dotL) 0.13 var(--h));flex:none;display:inline-block}
.over{color:var(--bad);font-weight:500}
.ex{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px dashed var(--faint);border-radius:5px;padding:0 5px;color:var(--muted)}
.secpill{font-family:var(--f-mono);font-size:10.5px;font-weight:500;border-radius:5px;padding:1px 5px;color:var(--surface)}
.secpill.S1{background:var(--s1)} .secpill.S2{background:var(--s2)} .secpill.S3{background:var(--s3)}
.evs{display:flex;flex-wrap:wrap;gap:6px}
.ev{font-size:12px;border-radius:7px;padding:3px 8px;background:var(--sunk);border:1px dashed var(--faint);color:var(--ink);text-align:left}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{padding:10px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
.cnt{font-family:var(--f-mono);font-size:11px;background:var(--bad-soft);color:var(--bad);border-radius:20px;padding:1px 7px}
.cnt.acc{background:var(--accent-soft);color:var(--accent-ink)}
.glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.gl{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.gl:hover{border-color:var(--faint)}
.gl b{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
.gl span{font-size:12.5px;color:var(--muted)}
.gl.alert{background:var(--bad-soft);border-color:transparent}.gl.alert b{color:var(--bad)}
.gl.good b{color:var(--good)}
.subtog{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;flex:none;margin-top:1px}
.subtog.open{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.task .subtog:not(.open){opacity:.75}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
li.subs{padding:0 0 8px 30px;display:flex;flex-direction:column;gap:6px}
li.subs .task{padding:5px 0;border:0;font-size:14px}
li.subs .chk{width:17px;height:17px;border-radius:5px}
li.subs .chk::after{left:5px;top:1px;width:4px;height:9px}
li.subs .in{padding:6px 10px;font-size:13.5px}
.cal-wrap{display:grid;grid-template-columns:210px minmax(0,1fr);gap:14px;align-items:start}
.tray{position:sticky;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 32px);overflow:auto}
.tchips{display:flex;flex-direction:column;gap:6px}
.tchip{border:1px solid var(--line);border-left:3px solid oklch(var(--dotL) 0.13 var(--h));background:var(--surface);border-radius:9px;padding:7px 9px;font-size:13px;text-align:left;cursor:grab;user-select:none;display:flex;flex-direction:column;gap:2px;flex:none}
.tchip .secpill{align-self:flex-start}
.tchip small{font-size:11px;color:var(--muted)}
.tchip.picked{outline:2px solid var(--accent);background:var(--accent-soft)}
.tchip.lifting,.cblk.lifting{opacity:.4}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:auto;max-height:78vh}
.cal-grid{display:grid;grid-template-columns:46px repeat(var(--cols),minmax(var(--minc),1fr))}
.cal-h{position:sticky;top:0;z-index:6;background:var(--surface);border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:8px;text-align:left;font-size:13px}
.cal-h b{font-family:var(--f-display);font-weight:400;font-size:22px}
.cal-h.today b{color:var(--accent-ink)}
.cal-h.gut{border-left:0;left:0;z-index:7}
div.gut{position:relative}
div.gut span{position:absolute;right:6px;font-family:var(--f-mono);font-size:10px;color:var(--faint);transform:translateY(-50%)}
div.gut span:first-child{transform:none}
.cal-col{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 48px;cursor:cell}
.cal-col.today{background-color:color-mix(in oklch,var(--accent-soft) 40%,transparent)}
.cblk{position:absolute;border-radius:8px;padding:3px 7px 6px;font-size:12px;overflow:hidden;text-align:left;background:oklch(var(--chipL) var(--chipC) var(--h));color:oklch(var(--chipTL) 0.1 var(--h));border-left:3px solid oklch(var(--dotL) 0.13 var(--h));line-height:1.25;cursor:grab;z-index:2}
.cblk.rec{cursor:pointer}
.cblk b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis}
.cblk small{font-family:var(--f-mono);font-size:10px;opacity:.85}
.cblk.done b{text-decoration:line-through;opacity:.6}
.cchk{float:right;width:14px;height:14px;border:1.5px solid currentColor;border-radius:4px;margin:1px 0 0 4px;position:relative;cursor:pointer}
.cchk.on{background:currentColor}
.rsz{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize}
.cblk:hover .rsz{background:linear-gradient(transparent 3px,oklch(var(--dotL) 0.13 var(--h) / .6) 3px 5px,transparent 5px)}
.preview{position:absolute;left:3px;right:3px;border:2px dashed var(--accent);border-radius:8px;background:var(--accent-soft);pointer-events:none;z-index:5;font-family:var(--f-mono);font-size:11px;padding:2px 6px;color:var(--accent-ink)}
.ghost{position:fixed;pointer-events:none;z-index:80;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:9px;font-size:13px;box-shadow:var(--shadow);max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none}
@media (max-width:899px){.cal-wrap{grid-template-columns:minmax(0,1fr)}.tray{position:static;max-height:none}.tchips{flex-direction:row;overflow-x:auto;padding-bottom:4px}.tchip{max-width:220px;min-width:150px}.cal{max-height:70vh}}
.rstat{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--faint);flex:none;margin-top:1px;position:relative}
.rstat.doing{border-color:var(--accent);background:linear-gradient(90deg,var(--accent) 50%,transparent 50%)}
.rstat.done{border-color:var(--accent);background:var(--accent)}
.rstat.done::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:rotate(45deg)}
.rlink{color:inherit;text-decoration:none}.rlink:hover{color:var(--accent-ink);text-decoration:underline}
.done .rlink{text-decoration:line-through}
.routine{columns:2 380px;column-gap:18px}
.routine .card{margin-bottom:18px}
.routine .card.now{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.steps-ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px}
.steps-ol li{padding-left:4px;line-height:1.45}
.steps-ol li::marker{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.steps-ol li span{display:block}
.carry{background:var(--bad-soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.carry .chead{font-size:13px}
.carry .task{border-color:color-mix(in oklch,var(--bad) 18%,transparent)}
.num{font-family:var(--f-display);font-size:22px;width:22px;text-align:center;color:var(--accent-ink);line-height:1;flex:none}
.addrow{display:flex;gap:8px}
.addrow .in{flex:1}

/* timeline */
.tl{position:relative;border-left:1px solid var(--line);margin-left:46px}
.tl .hr{position:absolute;left:-46px;right:0;font-family:var(--f-mono);font-size:10.5px;color:var(--faint);border-top:1px dashed var(--line);padding-top:0;height:0}
.tl .hr span{position:absolute;left:0;top:-7px;background:var(--surface);padding-right:6px}
.blk{position:absolute;border-radius:9px;padding:4px 8px;font-size:12.5px;overflow:hidden;text-align:left;background:oklch(var(--chipL) var(--chipC) var(--h));color:oklch(var(--chipTL) 0.1 var(--h));border-left:3px solid oklch(var(--dotL) 0.13 var(--h));line-height:1.25}

const MONTHS = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
function parseQuick(str, base) {

  const o = { date: null, cat: '', pri: 0, est: 0, sec: '', time: null };
  s = s.replace(/\s#([\p{L}\d_-]+)/gu, (m, tag) => { const t = tag.toLowerCase(); const c = cats().find(c => c.name.toLowerCase().replace(/\s+/g, '').startsWith(t)); if (c) { o.cat = c.id; return ' '; } return m; });
  s = s.replace(/\s!([123])(?=\s)/, (m, p) => { o.pri = 4 - Number(p); return ' '; });
  s = s.replace(/\s~?(\d+(?:\.\d+)?)\s?(m|min|mins|h|hr|hrs)(?=\s)/i, (m, n, u) => { o.est = Math.round(/^h/i.test(u) ? n * 60 : Number(n)); return ' '; });

  const dateRules = [
    [/\s(today|tod)(?=\s)/i, () => T],
    [/\s(tomorrow|tmr|tmrw)(?=\s)/i, () => addDays(T, 1)],
    [/\snext week(?=\s)/i, () => addDays(weekStartOf(T), 7)],
    [/\sin (\d+) days?(?=\s)/i, m => addDays(T, Number(m[1]))],
    [/\s(?:on\s)?(sun|mon|tue|tues|wed|thu|thur|thurs|fri|sat)(?:day|nesday|rsday|urday)?(?=\s)/i, m => { const tgt = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'].indexOf(m[1].slice(0, 3).toLowerCase()); let d = T; for (let i = 0; i < 7; i++) { if (wd(d) === tgt) return d; d = addDays(d, 1); } return d; }],
    [/\s(\d{1,2})\s(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*(?=\s)/i, m => mkDate(Number(m[1]), MONTHS.indexOf(m[2].toLowerCase()), T)],
    [/\s(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s(\d{1,2})(?=\s)/i, m => mkDate(Number(m[2]), MONTHS.indexOf(m[1].toLowerCase()), T)],
    [/\s(\d{1,2})\/(\d{1,2})(?=\s)/, m => mkDate(Number(m[1]), Number(m[2]) - 1, T)],
  ];

  return o;
}

}

function vReflect() {
  const D = UI.date, T = today(); const r = day(D).refl || {};
  const ws = weekStartOf(D), we = addDays(ws, 6); const wr = day(ws).weekly || {};
  const wt = S.tasks.list.filter(t => t.done && t.doneAt && ymd(new Date(t.doneAt)) >= ws && ymd(new Date(t.doneAt)) <= we).length;
  const hs = S.core.habits.filter(h => !h.archived); let due = 0, got = 0;
  for (let d = ws; d <= we && d <= T; d = addDays(d, 1)) for (const h of hs) if (habitDue(h, d) && h.freq.type !== 'times') { due++; if (ticked(h, d)) got++; }
  const moods = [], sl = []; for (let d = ws; d <= we; d = addDays(d, 1)) { const x = day(d); if (x.mood) moods.push(x.mood); if (x.sleep) sl.push(x.sleep); }
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  const study = focusIn(ws, we, f => !!f.sec);

function vWellness() {
  const T = today(); const days = Array.from({ length: 30 }, (_, i) => addDays(T, i - 29)); const prev = Array.from({ length: 30 }, (_, i) => addDays(T, i - 59));
  const metric = (k, label, max, fmtv, hue) => {
    const v = days.map(d => day(d)[k] ?? null), pv = prev.map(d => day(d)[k] ?? null).filter(x => x != null);
    const got = v.filter(x => x != null); const avg = got.length ? got.reduce((a, b) => a + b, 0) / got.length : null; const pavg = pv.length ? pv.reduce((a, b) => a + b, 0) / pv.length : null;
    const W = 300, H = 80, bw = W / 30;
    const bars = v.map((x, i) => x == null ? `<rect x="${i * bw + bw * .3}" y="${H - 2}" width="${bw * .4}" height="2" rx="1" fill="var(--line)"/>` : `<rect x="${i * bw + 1}" y="${H - Math.max(3, x / max * H)}" width="${bw - 2}" height="${Math.max(3, x / max * H)}" rx="2" fill="${i === 29 ? 'var(--accent)' : `oklch(var(--dotL) 0.11 ${hue})`}"/>`).join('');
    const delta = avg != null && pavg != null ? avg - pavg : null;
    return `<section class="card flat"><div class="chead"><h3>${label}</h3><span class="lab">last 30 days</span></div><div class="row" style="align-items:baseline;gap:10px"><span class="big" style="font-size:42px">${avg == null ? '–' : fmtv(avg)}</span><span class="small muted">average${delta != null ? ` · ${delta >= 0 ? '▲' : '▼'} ${fmtv(Math.abs(delta))} vs the 30 days before` : ''}</span></div>
      <svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:80px" role="img" aria-label="${label} over 30 days">${bars}</svg><div class="row small faint" style="justify-content:space-between"><span>${fmtShort(days[0])}</span><span>${got.length}/30 days logged</span><span>Today</span></div></section>`;
  };
  return header('How you are actually doing', 'Wellness', '<span>A day you did not log is a gap, never a zero. Log from the Check-in card on Today.</span>', `<button class="btn" data-act="go" data-v="today">Check in now</button>`) +
    `<div class="sec-grid">${metric('mood', 'Mood', 5, v => MOODS[Math.round(v) - 1] || v.toFixed(1), 350)}${metric('energy', 'Energy', 5, v => v.toFixed(1) + '/5', 60)}${metric('sleep', 'Sleep', 11, v => v.toFixed(1) + 'h', 260)}${metric('water', 'Water', Math.max(8, S.core.settings.water), v => v.toFixed(1), 230)}</div>`;
}

function paceInfo(sec) {

  if (sec === 'S2') {

    const now = from && weeks ? from - (from - target) / weeks * wi : null;
    const es = S.core.essays.filter(e => e.min).sort((a, b) => a.date < b.date ? 1 : -1).slice(0, 3);
    const actual = es.length ? es.reduce((a, e) => a + e.min, 0) / es.length : null;
    return { target, now, actual, unit: 'min per essay', from };
  }
  const target = targetPace(sec), diag = +(p[sec] || 0);
  const now = diag && weeks ? diag - (diag - target) / weeks * wi : null;
  const ds = S.core.drills.filter(d => d.sec === sec && d.min && d.n).sort((a, b) => a.date < b.date ? 1 : -1).slice(0, 3);
  const n = ds.reduce((a, d) => a + d.n, 0), m = ds.reduce((a, d) => a + d.min, 0);
  return { target, now, actual: n ? m / n : null, unit: 'min/Q', from: diag, weeks, wi };
}

      const t = newTask({ title: r.title, date: d, cat: r.study ? (r.cat || '') : (gamsatCat() ? gamsatCat().id : ''), sec: r.sec || '', est: r.est || 0, pri: r.pri || 0, imp: ws });
      S.tasks.list.push(t); nT++;
      if (P.times[r.id]) { const dd = day(d, true); (dd.blocks = dd.blocks || []).push({ id: uid(), s: P.times[r.id][0], e: P.times[r.id][1], t: r.title, cat: t.cat, imp: ws, taskId: t.id }); keys.add(dayKey(d)); nB++; }
    }
  }
  if (IMP.setGoal && IMP.hpw != null) { g.weekGoals = g.weekGoals || {}; g.weekGoals[ws] = IMP.hpw; }
  if (IMP.sec && ['S1', 'S2', 'S3'].some(k => +IMP.sec[k] > 0)) { g.secGoals = g.secGoals || {}; g.secGoals[ws] = { ...IMP.sec }; }
  g.imported = g.imported || {}; g.imported[ws] = Date.now();
  IMP.week = null; touch(...keys); closeSheet();
  UI.view = 'plan'; UI.planMode = 'week'; UI.planDate = ws; render();
  toast(`Added ${nT} tasks and ${nB} time blocks for the week of ${fmtShort(ws)}`);
}

function qaPreview() {
  const v = $('#qa').value; const prev = $('#qa-prev'), res = $('#qa-res'); if (!prev) return;
  if (QA.type === 'task' || QA.type === 'block') {
    const p = parseQuick(v, UI.view === 'today' ? UI.date : today());
    prev.innerHTML = [p.date ? `<span class="due-chip">${fmt(p.date, { weekday: 'short', day: 'numeric', month: 'short' })}</span>` : QA.type === 'task' ? '<span class="due-chip">No date → today</span>' : '', catChip(p.cat), secPill(p.sec), p.pri ? `<span class="due-chip">${['', 'Low', 'Medium', 'High'][p.pri]} priority</span>` : '', p.est ? `<span class="due-chip">${fmtMin(p.est)}</span>` : '', p.time ? `<span class="due-chip">at ${p.time}</span>` : ''].join('');
  } else prev.innerHTML = '';
  const q = v.trim().toLowerCase();
  if (q.length < 2) { res.innerHTML = ''; return; }
  const hits = [];
  for (const t of S.tasks.list) if (t.title.toLowerCase().includes(q)) hits.push(['task', t.title, `data-act="edit" data-id="${t.id}"`]);
  for (const p of S.core.projects) if (p.title.toLowerCase().includes(q)) hits.push(['project', p.title, `data-act="openProj" data-id="${p.id}"`]);
  for (const tp of S.core.topics) if (tp.name.toLowerCase().includes(q)) hits.push(['topic', tp.name, `data-act="go" data-v="gamsat"`]);
  for (const [, m] of Object.entries(S.months)) for (const [d, x] of Object.entries(m.days)) { if (x.refl) for (const [k, txt] of Object.entries(x.refl)) if (typeof txt === 'string' && txt.toLowerCase().includes(q)) { hits.push(['journal', `${fmtShort(d)}: ${txt.slice(0, 80)}`, `data-act="openRefl" data-date="${d}"`]); break; } }
  res.innerHTML = hits.slice(0, 8).map(([k, l, a]) => `<button ${a}><span class="k">${k}</span><span>${esc(l)}</span></button>`).join('');
}

/* ---- focus timer ---- */
let F = { dur: 25, left: 25 * 60, running: false, endAt: 0, sec: 'S3', label: '', tick: null };
function focusSheet() {
  const pct = F.left / (F.dur * 60); const C = 2 * Math.PI * 96;
  openSheet(sheetHead('Focus') + `
    <div class="chip-row">${[15, 25, 45, 60, 90].map(m => `<button class="fchip ${F.dur === m ? 'on' : ''}" data-act="fDur" data-m="${m}" ${F.running ? 'disabled' : ''}>${m}m</button>`).join('')}</div>
    <div class="ring"><svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="96" fill="none" stroke="var(--sunk)" stroke-width="10"/><circle id="f-arc" cx="110" cy="110" r="96" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}"/></svg><div class="t"><div><b id="f-time">${toClock(F.left)}</b><div class="lab">${F.running ? 'focus' : 'ready'}</div></div></div></div>
    <div class="grid2"><div class="field"><span class="lab">Counts towards</span><select class="in" id="f-sec" data-ch="fSec"><option value="S1" ${F.sec === 'S1' ? 'selected' : ''}>GAMSAT S1</option><option value="S2" ${F.sec === 'S2' ? 'selected' : ''}>GAMSAT S2</option><option value="S3" ${F.sec === 'S3' ? 'selected' : ''}>GAMSAT S3</option><option value="" ${!F.sec ? 'selected' : ''}>Other (uni, placement…)</option></select></div>
    <div class="field"><span class="lab">Working on</span><input class="in" id="f-label" value="${esc(F.label)}" placeholder="e.g. Kinematics problems" data-ch="fLabel"></div></div>
    <div class="row" style="justify-content:center"><button class="btn" data-act="fReset">Reset</button><button class="btn pri" data-act="fToggle" style="min-width:120px">${F.running ? 'Pause' : F.left < F.dur * 60 ? 'Resume' : 'Start'}</button>${F.running || F.left < F.dur * 60 ? `<button class="btn" data-act="fFinish">Finish & log</button>` : ''}</div>
    <p class="small muted" style="text-align:center">Sessions are logged automatically and add up in your GAMSAT study hours.</p>`);
}
const toClock = s => `${pad(Math.floor(s / 60))}:${pad(Math.floor(s % 60))}`;
function fTick() {
  if (!F.running) return;
  F.left = Math.max(0, Math.round((F.endAt - Date.now()) / 1000));
  const t = $('#f-time'); if (t) t.textContent = toClock(F.left);
  const a = $('#f-arc'); if (a) { const C = 2 * Math.PI * 96; a.setAttribute('stroke-dashoffset', C * (1 - F.left / (F.dur * 60))); }
  const p = $('#fp-t'); if (p) p.textContent = toClock(F.left);
  if (F.left <= 0) fComplete(F.dur);
}
function fComplete(min) {
  F.running = false; clearInterval(F.tick);
  if (min >= 1) { logFocus(today(), Math.round(min), F.sec, F.label); toast(`${fmtMin(min)} logged${F.sec ? ' to ' + F.sec : ''}. Take a short break.`); chime(); }
  F.left = F.dur * 60; if ($('#sheet').innerHTML && $('#f-time')) focusSheet(); else render();
}
function chime() { try { const ac = new (window.AudioContext || window.webkitAudioContext)(); [523, 659, 784].forEach((f, i) => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = f; o.connect(g); g.connect(ac.destination); const t = ac.currentTime + i * .18; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(.2, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .6); o.start(t); o.stop(t + .65); }); } catch (e) {} }
function renderPill() { $('#fpill').innerHTML = F.running || F.left < F.dur * 60 ? `<button class="fpill" data-act="focus">${ICON.timer.replace('<svg', '<svg width="16" height="16"')}<span id="fp-t">${toClock(F.left)}</span>${F.sec ? `<span class="secpill ${F.sec}">${F.sec}</span>` : ''}</button>` : ''; }

/* ---- toast ---- */
function toast(msg, undo) {
  const el = document.createElement('div'); el.className = 'toast'; el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button>Undo</button>' : ''}`;
  if (undo) el.querySelector('button').onclick = () => { undo(); el.remove(); };
  const box = $('#toasts'); while (box.children.length >= 2) box.firstElementChild.remove(); box.appendChild(el); setTimeout(() => el.remove(), undo ? 6000 : 3000);
}
function withUndo(msg, keys, fn) {
  const snap = keys.map(k => [k, clone(getDoc(k) || null)]);
  fn();
  toast(msg, () => { for (const [k, v] of snap) if (v) setDoc(k, v); commit(...keys); });
}

  weekly: el => { const d = day(el.dataset.date, true); d.weekly = d.weekly || {}; d.weekly[el.dataset.k] = el.value; touch(dayKey(el.dataset.date)); autosize(el); },
  tnotes: el => { const t = S.tasks.list.find(x => x.id === el.dataset.id); if (t) { t.notes = el.value; touch('tasks'); } },
  projNotes: el => { const p = S.core.projects.find(x => x.id === el.dataset.id); if (p) { p.notes = el.value; touch('core'); } },
  taskQ: el => { UI.taskQ = el.value; clearTimeout(INP._q); INP._q = setTimeout(() => { const pos = el.selectionStart; render(); const n = $('#task-q'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 200); },
};
let inpTimers = new WeakMap();
document.addEventListener('click', e => { if (suppressClick) { e.preventDefault(); e.stopPropagation(); return; } const a = e.target.closest('[data-act]'); if (!a) return; if (a.tagName === 'INPUT') return; const fn = ACT[a.dataset.act]; if (fn) { if (a.dataset.act !== 'scrim') e.preventDefault(); fn(a, e); } });
document.addEventListener('change', e => { const el = e.target.closest('[data-ch]'); if (el && CH[el.dataset.ch]) CH[el.dataset.ch](el, e); });
document.addEventListener('input', e => { const el = e.target; if (el.id === 'qa') { qaPreview(); return; } if (el.dataset && el.dataset.inp && INP[el.dataset.inp]) { if (el.dataset.inp === 'taskQ') return INP.taskQ(el); if (el.dataset.inp === 'resQ') return INP.resQ(el); if (el.dataset.auto) autosize(el); clearTimeout(inpTimers.get(el)); inpTimers.set(el, setTimeout(() => INP[el.dataset.inp](el), 400)); } });
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if (S.core) quickSheet(); return; }
  if (e.key === 'Escape' && $('#sheet').innerHTML) { closeSheet(); return; }
  if (e.key === 'Enter' && !e.shiftKey) { const el = e.target.closest && e.target.closest('[data-enter]'); if (el && el.tagName === 'INPUT') { e.preventDefault(); const fn = ACT[el.dataset.enter]; if (fn) fn(el, e); } }
});
/* drag to reorder dashboard cards */
let dragI = null;
document.addEventListener('dragstart', e => { const li = e.target.closest && e.target.closest('#cardlist li'); if (!li) return; dragI = +li.dataset.i; li.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; });
document.addEventListener('dragover', e => { if (dragI != null && e.target.closest && e.target.closest('#cardlist li')) e.preventDefault(); });
document.addEventListener('drop', e => { const li = e.target.closest && e.target.closest('#cardlist li'); if (!li || dragI == null) return; e.preventDefault(); const a = S.core.settings.cards; const [m] = a.splice(dragI, 1); a.splice(+li.dataset.i, 0, m); dragI = null; commit('core'); });
document.addEventListener('dragend', () => { dragI = null; document.querySelectorAll('#cardlist .drag').forEach(x => x.classList.remove('drag')); });
/* flush text still waiting in a debounce when the page is hidden */
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} if (dirty.size) flush(); } else { if (UI.date < today() && UI.view === 'today' && UI.lastSeen !== today()) { UI.date = today(); } UI.lastSeen = today(); if (booted) safeRender(); } });
setInterval(() => { if (booted && UI.view === 'today' && !$('#sheet').innerHTML) safeRender(); }, 5 * 60 * 1000);

/* ============================== boot ============================== */
function welcome() {
  applyLook();
  $('#side').innerHTML = ''; $('#bnav').innerHTML = '';
  $('#main').innerHTML = `<div class="welcome card"><span class="lab">Welcome</span><h1 class="title">Your days, <em>in one calm place.</em></h1>
    <p class="muted">Tasks that carry over until you deal with them, time blocks, habits with honest streaks, a GAMSAT study hub, and room to reflect.</p>
    <div class="grid2"><div class="field"><span class="lab">What should I call you?</span><input class="in" id="w-name" placeholder="Your first name" autofocus></div><div class="field"><span class="lab">GAMSAT S1 + S3 date (optional)</span><input type="date" class="in" id="w-g"></div></div>
    <div class="row"><button class="btn pri" data-act="startFresh" data-ex="1">Start with examples</button><button class="btn" data-act="startFresh" data-ex="0">Start blank</button></div>
    <p class="small muted">Examples show how everything fits together. They're tagged and you can clear them in one tap.</p></div>`;
}
function startApp(withEx) {
  S.core = blankCore(); S.tasks = { _u: Date.now(), list: [] };
  S.core.settings.name = val('w-name').trim(); S.core.settings.gamsat.date = val('w-g');
  normalise();
  if (withEx) seedExamples();
  booted = true; touch(...allKeys()); render();
}
async function boot() {
  try { const raw = localStorage.getItem(LS); if (raw) { const j = JSON.parse(raw); if (j && j.core) S = { core: j.core, tasks: j.tasks, res: j.res || null, months: j.months || {}, archive: j.archive || {} }; } } catch (e) {}
  try { const u = JSON.parse(localStorage.getItem(LSUI) || '{}'); Object.assign(UI, { view: u.view || 'today', taskFilter: u.taskFilter || 'today', planMode: u.planMode || 'week', gTab: u.gTab || 'week' }); } catch (e) {}
  UI.lastSeen = today();
  if (S.core) { normalise(); maybeArchive(); const dd = dedupeResources(); booted = true; render(); if (dd) toast(`Merged ${dd} duplicate resource${dd > 1 ? 's' : ''}`); initRemote(); return; }
  applyLook();
  await initRemote();
  if (S.core) { normalise(); maybeArchive(); booted = true; render(); } else welcome();
}
boot();
</script>
